<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Construcciones y Reformas F2F</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Archivo"; src: url("/assets/fonts/archivo-var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
    @font-face { font-family: "Instrument Serif"; src: url("/assets/fonts/instrument-serif-italic.woff2") format("woff2"); font-style: italic; font-display: swap; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 2rem 1.25rem;
      font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1d1b18; background-color: #f5f0e8;
      background-image: linear-gradient(rgba(29,27,24,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(29,27,24,.05) 1px, transparent 1px);
      background-size: 24px 24px; -webkit-font-smoothing: antialiased;
    }
    main { max-width: 34rem; text-align: center; }
    .code { font-size: clamp(5rem, 22vw, 9rem); font-weight: 800; font-stretch: 125%; line-height: .85; letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 1.5px #b64a26; margin: 0 0 1.5rem; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 740; font-stretch: 112%; letter-spacing: -.02em; line-height: 1.1; }
    h1 em { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-stretch: 100%; color: #b64a26; }
    p { margin: 0 0 2rem; color: #57524a; font-size: 1.08rem; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: .8rem 1.35rem; border-radius: 999px; border: 1.5px solid rgba(29,27,24,.24); color: #1d1b18; font-weight: 620; text-decoration: none; }
    a.primary { background: #b64a26; border-color: #b64a26; color: #fff; }
    a:focus-visible { outline: 2.5px solid #b64a26; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1 data-t="h1">Esta página <em>no existe.</em></h1>
    <p data-t="text">Puede que la dirección haya cambiado con la nueva web. Desde la página principal encontrarás nuestros servicios, proyectos y datos de contacto.</p>
    <div class="actions">
      <a class="primary" href="/" data-t="home">Ir a la página principal</a>
      <a href="tel:+34620218734" data-t="call">Llamar al 620&nbsp;218&nbsp;734</a>
    </div>
  </main>
  <script>
    // Misma página para los tres idiomas: se elige según la ruta (/va/… o /en/…)
    (function () {
      var match = location.pathname.match(/^\/(va|en)(\/|$)/);
      if (!match) return;
      var T = {
        va: {
          lang: 'ca-valencia', root: '/va/', title: 'Pàgina no trobada · Construcciones y Reformas F2F',
          h1: 'Esta pàgina <em>no existeix.</em>',
          text: "Potser l'adreça ha canviat amb la nova web. Des de la pàgina principal trobaràs els nostres serveis, projectes i dades de contacte.",
          home: "Torna a l'inici", call: 'Telefona al 620&nbsp;218&nbsp;734'
        },
        en: {
          lang: 'en', root: '/en/', title: 'Page not found · Construcciones y Reformas F2F',
          h1: "This page <em>doesn't exist.</em>",
          text: 'The address may have changed with our new website. From the home page you can find our services, projects and contact details.',
          home: 'Go to the home page', call: 'Call 620&nbsp;218&nbsp;734'
        }
      }[match[1]];
      document.documentElement.lang = T.lang;
      document.title = T.title;
      document.querySelectorAll('[data-t]').forEach(function (el) { el.innerHTML = T[el.getAttribute('data-t')]; });
      document.querySelector('[data-t="home"]').setAttribute('href', T.root);
    })();
  </script>
</body>
</html>
